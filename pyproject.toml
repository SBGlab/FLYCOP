[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FLYCOP"
version = "1.5.0"
authors = [
  { name="SBG Team", email="dsanleon@cnb.csic.es" },
]
description = "FLYCOP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cobra==0.29.1",
    "cometspy==0.5.2",
    "gurobipy==11.0.3",
    "smac==2.4.0",
    "optuna==4.8.0",
    "pandas>=2.2.3",
    "numpy>=2.2.3",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "scikit-optimize",
]

[project.urls]
Homepage = "https://github.com/SBGlab/FLYCOP"
Issues = "https://github.com/SBGlab/FLYCOP/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
